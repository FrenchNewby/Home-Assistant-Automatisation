              - entity: sensor.socomec_i35_facteur_de_puissance
                name: Facteur de Puissance (cos φ)
              - entity: sensor.socomec_i35_energie_active_ea
                name: Énergie Cumulative Ea+

      # =================================================================
      # SECTION 4 : MODULE I-35 (2) (CHARGES & PUISSANCES)
      # =================================================================
      - type: grid
        title: Centrales I-35 (2)
        cards:
          # Phase 1
          - type: entities
            title: Charge Phase 1 (I1)
            show_header_toggle: false
            entities:
              - entity: sensor.socomec_i35_2_courant_i1
                name: Courant Instantané
                icon: mdi:current-ac
              - entity: sensor.socomec_i35_2_puissance_active_p1
