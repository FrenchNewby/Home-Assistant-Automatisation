


title: Caméra de Sécurité (ONVIF & Debug IA)
views:
  - title: Live & Contrôles PTZ
    path: live_ptz
    icon: mdi:camera
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Flux Vidéo HD en Direct (ONVIF)
          - type: picture-entity
            entity: camera.ip_camera_profile_000
            name: Flux Vidéo Temps Réel (ONVIF)
            camera_view: live
            show_state: true
            show_name: true
          - type: entities
            title: Statut Caméra & Carte SD
            show_header_toggle: false
            entities:
              - entity: switch.security_camera_detection_de_mouvement
                name: Détection de Mouvement Active
                icon: mdi:motion-sensor
              - entity: switch.security_camera_camera_privacy
                name: Mode Confidentialité (Masquer la caméra)
                icon: mdi:incognito
              - entity: sensor.security_camera_sd_status
                name: État Carte Mémoire SD
                icon: mdi:sd
      - type: grid
        cards:
          - type: heading
            heading: Contrôle Motorisé (Pan-Tilt-Zoom)
          - type: grid
            square: false
            columns: 3
            cards:
              - type: button
                icon: mdi:blank
                tap_action:
                  action: none
              - type: button
                name: Haut
                icon: mdi:chevron-up
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.security_camera_ptz_up
              - type: button
                icon: mdi:blank
                tap_action:
                  action: none
              - type: button
                name: Gauche
                icon: mdi:chevron-left
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.security_camera_ptz_left
              - type: button
                name: STOP
                icon: mdi:stop-circle
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.security_camera_ptz_stop
              - type: button
                name: Droite
                icon: mdi:chevron-right
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.security_camera_ptz_right
              - type: button
                icon: mdi:blank
                tap_action:
                  action: none
              - type: button
                name: Bas
                icon: mdi:chevron-down
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.security_camera_ptz_down
              - type: button
                icon: mdi:blank
                tap_action:
                  action: none

  - title: Simulation & Debug IA
    path: debug_tracabilite
    icon: mdi:bug
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 📸 Image Soumise à Double Take
          - type: picture-entity
            entity: camera.ip_camera_profile_000
            name: Capture instantanée extraite du flux
            show_state: false
            show_name: true
          - type: button
            name: 🌐 OUVRIR LA GALERIE DOUBLE TAKE (WEB UI)
            icon: mdi:open-in-new
            tap_action:
              action: url
              url_path: /c7657554_double-take

      - type: grid
        cards:
          - type: heading
            heading: 🚀 Simuler un Mouvement & Lancer l'IA
          - type: button
            name: SIMULER DÉTECTION & ANALYSER LE VISAGE
            icon: mdi:play-circle-outline
            tap_action:
              action: call-service
              service: automation.trigger
              target:
                entity_id: automation.camera_securite_declencher_reconnaissance_faciale_double_take
          - type: entities
            title: 📊 Confirmation & Statut Double Take
            show_header_toggle: false
            entities:
              - entity: sensor.double_take_horodatage_scan
                name: Heure du Dernier Scan IA
                icon: mdi:clock-check-outline
              - entity: sensor.double_take_duree_calcul_ia
                name: Temps de Calcul CodeProject.AI
                icon: mdi:timer-outline
              - entity: sensor.double_take_personnes_detectees
                name: Nb de Personnes Détectées
                icon: mdi:account-group-outline
              - entity: sensor.dernier_visage_detecte
                name: Dernier Visage Identifié
                icon: mdi:face-recognition

  - title: Réglages Caméra
    path: reglages_camera
    icon: mdi:tune-variant
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Options de Détection & Tracking
          - type: entities
            title: Activer / Désactiver
            show_header_toggle: false
            entities:
              - entity: switch.security_camera_motion_tracking
                name: Suivi Automatique des Personnes (Tracking PTZ)
                icon: mdi:target-account
              - entity: switch.security_camera_sound_detection
                name: Détection Sonore
                icon: mdi:ear-hearing
              - entity: switch.security_camera_camera_record
                name: Enregistrement Vidéo Manuel
                icon: mdi:record-rec
      - type: grid
        cards:
          - type: heading
            heading: Sensibilité & Sirène
          - type: entities
            title: Ajustements Debug
            show_header_toggle: false
            entities:
              - entity: select.security_camera_sensibilite_au_mouvement
                name: Sensibilité Détection Mouvement
                icon: mdi:tune
              - entity: select.security_camera_sound_sensitivity
                name: Sensibilité Détection Sonore
                icon: mdi:volume-high
              - entity: select.security_camera_vision_nocturne
                name: Mode Vision Nocturne IR
                icon: mdi:weather-night
              - entity: select.security_camera_mode_d_enregistrement
                name: Mode Enregistrement SD
                icon: mdi:video-vintage
              - entity: switch.security_camera_alarm
                name: Sirène / Alarme Intégrée
                icon: mdi:bullhorn-outline