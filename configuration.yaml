# Intégration Modbus TCP pour centrales de mesure Socomec
# Intégration Modbus TCP pour centrales de mesure Socomec
modbus:
  - name: diris_a40
    type: tcp
    host: 192.168.1.165
    port: 502
    sensors:
      # =================================================================
      # MODULE U-30 (Tension / Fréquence) - Slave ID: 6
      # =================================================================
      - name: "Socomec U30 Tension Simple Système"
        slave: 6
        address: 36867
        data_type: uint32
        scale: 0.01
        precision: 1
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 15
      - name: "Socomec U30 Tension Composée Système"
        slave: 6
        address: 36869
        data_type: uint32
        scale: 0.01
        precision: 1
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 15
      - name: "Socomec U30 Fréquence"
        slave: 6
        address: 36871
        data_type: uint32
        scale: 0.001
        precision: 2
        unit_of_measurement: "Hz"
        state_class: measurement
        scan_interval: 15
      - name: "Socomec U30 Tension V1"
        slave: 6
        address: 36873
        data_type: uint32
        scale: 0.01
        precision: 1
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 15
      - name: "Socomec U30 Tension V2"
        slave: 6
