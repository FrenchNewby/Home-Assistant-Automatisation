        state_class: measurement
        scan_interval: 15
      - name: "Socomec U30 Tension V3"
        slave: 6
        address: 36877
        data_type: uint32
        scale: 0.01
        precision: 1
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 15
      # =================================================================
      # MODULE S-135 (Mesures Circuit Dédié) - Slave ID: 3
      # =================================================================
      - name: "Socomec S135 Courant Système"
        slave: 3
        address: 18440
