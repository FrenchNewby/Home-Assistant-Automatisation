default_config:
# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
automation: !include_dir_merge_list automations
script: !include scripts.yaml
scene: !include scenes.yaml
input_boolean:
  mode_tv:
    name: Mode TV
    icon: mdi:television
  detection_mouvement_salon_blink:
    name: "Détection Mouvement Salon Blink"
    icon: mdi:motion-sensor

input_select:
  choix_echo:
    name: "Choix de l'enceinte Echo"
    options:
      - "Salon"
      - "Salle de Bain"
      - "Martin"
      - "Flora"
      - "Parents"
      - "Partout"
    icon: mdi:speaker-multiple
  choix_musique:
    name: "Choix de la musique/radio"
    options:
      - "Ma Musique (Deezer)"
      - "Playlist Pop (Deezer)"
      - "Playlist Rock (Deezer)"
      - "RTL"
      - "France Inter"
      - "NRJ"
      - "Nostalgie"
    icon: mdi:music
group:
  gestion_automations_volets:
    name: "Contrôle Automatisations Volets"
    entities:
      - automation.fermer_les_volets
      - automation.ouvrir_les_volets
template:
  - binary_sensor:
      - name: "PC Johan Actif"
        unique_id: pc_johan_actif
        device_class: running
        state: "{{ states('sensor.pr2_puissance') | float(0) > 15.0 }}"
      - name: "Alarme pression chaudière"
        unique_id: boiler_pressure_alarm
        device_class: problem
        state: >
          {% set p = states('sensor.pression_chauffage_num') | float(0) %}
          {{ p < 0.8 or p > 2.5 }}
        attributes:
          pressure_bar: "{{ states('sensor.pression_chauffage_num') }}"
          low_threshold: "{{0.8}}"
          high_threshold: "{{2.5}}"
      - name: "Johan à la maison (mix)"
        unique_id: johan_home_mix
        device_class: presence
        state: >
          {{
            is_state('person.johan','home')
            or states('sensor.redmi13_johan_wifi_connection') in ['reseau_JRB','reseau_JRB_F']
          }}
      - name: "Mami à la maison (mix)"
        unique_id: Mami_home
        device_class: presence
        state: >
          {{
            is_state('person.Mami','home')
            or states('device_tracker.s22_de_mami','home')
          }}
      - name: "Clim Active"
        unique_id: clim_active
        state: "{{ not is_state('climate.espclim_mqtt_climate', 'off') }}"
      - name: "TV Active"
        unique_id: tv_active
        state: "{{ states('media_player.tv_salon') not in ['off', 'unavailable', 'unknown', 'none'] }}"
  - sensor:
      - name: "Socomec D70 IP Address"
        unique_id: socomec_d70_ip_address
        state: >
          {% set ip = states('sensor.socomec_d70_ip_integer') | int(0) %}
          {% if ip > 0 %}
            {{ (ip // 16777216) % 256 }}.{{ (ip // 65536) % 256 }}.{{ (ip // 256) % 256 }}.{{ ip % 256 }}
          {% else %}
            Unavailable
          {% endif %}
      - name: "Socomec D70 Nom Clean"
        unique_id: socomec_d70_nom_clean
        state: >
          {{ states('sensor.socomec_d70_nom') | replace('\x00', '') | trim }}
      - name: "Socomec D70 Nom de Domaine Clean"
        unique_id: socomec_d70_nom_de_domaine_clean
        state: >
          {{ states('sensor.socomec_d70_nom_de_domaine') | replace('\x00', '') | trim }}
      - name: "Puissance Injectée Réseau (Digiware)"
        unique_id: puissance_injectee_reseau_digiware
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.socomec_i35_7_depart_general_puissance_active_p1') | float(0) %}
          {{ (-p) if p < 0 else 0.0 }}
        availability: >
          {{ states('sensor.socomec_i35_7_depart_general_puissance_active_p1') not in ['unknown', 'unavailable', 'none'] }}
      - name: "Puissance Consommée Réseau (Digiware)"
        unique_id: puissance_consommee_reseau_digiware
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.socomec_i35_7_depart_general_puissance_active_p1') | float(0) %}
          {{ p if p > 0 else 0.0 }}
        availability: >
          {{ states('sensor.socomec_i35_7_depart_general_puissance_active_p1') not in ['unknown', 'unavailable', 'none'] }}
      - name: "Double Take Horodatage Scan"
        unique_id: double_take_horodatage_scan
        icon: mdi:clock-check-outline
        state: >
          {% set ts_auto = state_attr('automation.camera_securite_declencher_reconnaissance_faciale_double_take', 'last_triggered') %}
          {% set ts_dt = state_attr('sensor.double_take_salon', 'timestamp') %}
          {% if ts_auto %}
            {{ as_local(as_datetime(ts_auto)).strftime('%d/%m/%Y à %H:%M:%S') }}
          {% elif ts_dt %}
            {{ as_local(as_datetime(ts_dt)).strftime('%d/%m/%Y à %H:%M:%S') }}
          {% else %}
            Pas de scan
          {% endif %}
      - name: "Double Take Durée Calcul IA"
        unique_id: double_take_duree_calcul_ia
        unit_of_measurement: "s"
        icon: mdi:timer-outline
        state: >
          {% set dur = state_attr('sensor.double_take_salon', 'duration') or state_attr('sensor.double_take_security_camera', 'duration') %}
          {{ dur | float(0) | round(2) if dur is not none else 0.0 }}
      - name: "Double Take Personnes Détectées"
        unique_id: double_take_personnes_detectees
        icon: mdi:account-group-outline
        state: >
          {% set counts = state_attr('sensor.double_take_salon', 'counts') or state_attr('sensor.double_take_security_camera', 'counts') %}
          {{ counts.person if counts and 'person' in counts else 0 }}
      - name: "Socomec D70 Date & Heure"
        unique_id: socomec_d70_date_heure
        state: >
          {% set day = states('sensor.socomec_d70_jour') | int(0) %}
          {% set month = states('sensor.socomec_d70_mois') | int(0) %}
          {% set year = states('sensor.socomec_d70_annee') | int(0) %}
          {% set hour = states('sensor.socomec_d70_heure') | int(0) %}
          {% set minute = states('sensor.socomec_d70_minute') | int(0) %}
          {% set second = states('sensor.socomec_d70_seconde') | int(0) %}
          {% if year > 0 %}
            {{ "%02d/%02d/%04d %02d:%02d:%02d" | format(day, month, 2000 + year, hour, minute, second) }}
          {% else %}
            Unavailable
          {% endif %}
      # Jeton de face recognition Double Take
      - name: "Dernier Visage Détecté"
        unique_id: dernier_visage_detecte_salon
        icon: mdi:face-recognition
        state: >
          {% set matches = state_attr('sensor.double_take_salon', 'matches') %}
          {% if matches and matches | length > 0 %}
            {{ matches[0].name | title }} ({{ matches[0].confidence | round(0) }}%)
          {% else %}
            Inconnu
          {% endif %}
      - name: "PR4 MAL – Énergie (kWh) FIX"
        unique_id: pr4_mal_energy_kwh_fix
        state: "{{ states('sensor.pr4_mal_energy') | float(0) / 1000}}"
        unit_of_measurement: "kWh"          # si ta source est en Wh, divise par 1000
        device_class: energy
        state_class: total_increasing
        availability: >
          {{ states('sensor.pr4_mal_energy') not in ['unknown','unavailable','none'] }}
      - name: "PR2 – Énergie (kWh) – dashboard"
        unique_id: pr2_energy_kwh_dashboard
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # On force un nombre même si la source est momentanément inconnue
        state: "{{ states('sensor.pr2_energie_totale')|float(0) }}"
        availability: >
          {{ states('sensor.pr2_energie_totale') not in ['unknown','unavailable','none'] }}
      - name: "PR1 Ampli – Énergie (kWh) FIX"
        unique_id: pr1_ampli_energy_kwh_fix
        state: "{{ states('sensor.pr1_energy_2') | float(0) / 1000}}"
        unit_of_measurement: "kWh"          # si ta source est en Wh, divise par 1000
        device_class: energy
        state_class: total_increasing
        availability: >
          {{ states('sensor.pr1_energy_2') not in ['unknown','unavailable','none'] }}
      - name: "HC1 Consigne Courante"
        unit_of_measurement: "°C"
        state: >
          {% set modetype = states('sensor.ems_esp_thermostat_hc1_modetype')|lower|replace('é','e') %}
          {% set t_day   = states('number.ems_esp_thermostat_hc1_daytemp')|replace(',','.')|float(0) %}
          {% set t_night = states('number.ems_esp_thermostat_hc1_nighttemp')|replace(',','.')|float(0) %}
          {% if 'nuit' in modetype or 'night' in modetype or 'reduit' in modetype or 'eco' in modetype %}
            {{ t_night }}
          {% else %}
            {{ t_day }}
          {% endif %}
      - name: "Puissance Injectée Réseau"
        unique_id: puissance_injectee_reseau
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set linky = states('sensor.garage_linky_esp32_linky_puissance_apparente') | float(0) %}
          {% set pince = states('sensor.double_clamp_meter_puissance_a') | float(0) %}
          {# Si le Linky affiche 0 (ou proche), la valeur absolue de la pince est notre injection #}
          {% if linky <= 10 %}
            {{ pince | round(1) }}
          {% else %}
            0.0
          {% endif %}
      - name: "Trajet Socomec Distance"
        unit_of_measurement: "km"
        state: "{{ state_attr('sensor.trajet_vers_socomec','distance') }}"
      - name: "Trajet Socomec Itineraire"
        state: "{{ state_attr('sensor.trajet_vers_socomec','route') }}"
      # --- Températures principales (numériques) ---
      - name: "Boiler Temp flux (num)"
        unique_id: boiler_curflowtemp_num
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{ states('sensor.ems_esp_boiler_curflowtemp') | regex_replace('°C','') | float(0) }}
      - name: "Boiler Temp retour (num)"
        unique_id: boiler_rettemp_num
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{ states('sensor.ems_esp_boiler_rettemp') | regex_replace('°C','') | float(0) }}
      - name: "Boiler Temp chaudière (num)"
        unique_id: boiler_boiltemp_num
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{ states('sensor.ems_esp_boiler_boiltemp') | regex_replace('°C','') | float(0) }}
      - name: "Extérieure (num)"
        unique_id: boiler_outdoor_temp_num
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{ states('sensor.ems_esp_boiler_outdoortemp') | regex_replace('°C','') | float(0) }}
      - name: "ECS Temp interne (num)"
        unique_id: boiler_wwcurtemp_num
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{ states('sensor.ems_esp_boiler_wwcurtemp') | regex_replace('°C','') | float(0) }}
      # --- Pression système ---
      - name: "Pression chauffage (num)"
        unique_id: boiler_syspress_num
        unit_of_measurement: "bar"
        device_class: pressure
        state_class: measurement
        state: >
          {{ states('sensor.ems_esp_boiler_syspress') | regex_replace('bar','') | float(0) }}
      # --- Modulations / puissances ---
      - name: "Pompe chauffage modulation (num)"
        unique_id: boiler_pump_mod_num
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {{ states('sensor.ems_esp_boiler_heatingpumpmod') | regex_replace('%','') | float(0) }}
      - name: "Brûleur puissance actuelle (num)"
        unique_id: boiler_burnpow_num
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {{ states('sensor.ems_esp_boiler_curburnpow') | regex_replace('%','') | float(0) }}
      # --- Énergie (kWh) ---
      - name: "Énergie totale chaudière (kWh)"
        unique_id: boiler_energy_total_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {{ states('sensor.ems_esp_boiler_nrgtotal') | regex_replace('kWh','') | float }}
        availability: >
          {{ states('sensor.ems_esp_boiler_nrgtotal') not in ['unknown', 'unavailable', 'none'] }}
      - name: "Énergie ECS (kWh)"
        unique_id: boiler_energy_ww_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {{ states('sensor.ems_esp_boiler_nrgww') | regex_replace('kWh','') | float }}
        availability: >
          {{ states('sensor.ems_esp_boiler_nrgww') not in ['unknown', 'unavailable', 'none'] }}
      - name: "Électricité Totale Clamps (kWh) Robust"
        unique_id: electricity_total_clamps_robust
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {{ states('sensor.double_clamp_meter_total_energy_a') | float }}
        availability: >
          {% set val = states('sensor.double_clamp_meter_total_energy_a') %}
          {{ val not in ['unknown', 'unavailable', 'none'] and val | float(0) > 0.1 }}

#config pour Nginx
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.30.33.0/24 # réseau des add-ons HA (couvre Nginx Proxy Manager)
    - 172.30.32.0/24 # passerelle et réseau interne supervisor
api:
alexa:
  smart_home:
    locale: fr-FR
    endpoint: https://api.eu.amazonalexa.com/v3/events
    client_id: !secret alexa_client_id
    client_secret: !secret alexa_client_secret
rest_command:
  double_take_security_camera:
    url: "http://c7657554-double-take:3000/api/recognize?camera=salon&url=http://172.30.32.1:8123/local/salon_snapshot_{{ index | default(1) }}.jpg"
    method: GET

# Intégration Modbus TCP pour centrales de mesure Socomec
modbus:
  - name: diris_a40
    type: tcp
    host: 192.168.1.165
    port: 502
    sensors:
      # =================================================================
      # MODULE U-30 (Tension / Fréquence) - Slave ID: 6
      # =================================================================
      - name: "Socomec U30 Fréquence"
        slave: 6
        address: 36871
        data_type: uint32
        scale: 0.001
        precision: 2
        unit_of_measurement: "Hz"
        state_class: measurement
        scan_interval: 15
      - name: "Socomec U30 Tension V1"
        slave: 6
        address: 36873
        data_type: uint32
        scale: 0.01
        precision: 1
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 15

      # =================================================================
      # MODULE D-70 (Passerelle Gateway) - Slave ID: 1
      # =================================================================
      - name: "Socomec D70 Nom"
        slave: 1
        address: 50000
        data_type: string
        count: 4
        scan_interval: 3600
      - name: "Socomec D70 IP Integer"
        slave: 1
        address: 29184
        data_type: uint32
        scan_interval: 3600
      - name: "Socomec D70 Nom de Domaine"
        slave: 1
        address: 29194
        data_type: string
        count: 25
        scan_interval: 3600
      - name: "Socomec D70 Jour"
        slave: 1
        address: 29952
        data_type: uint16
        scan_interval: 60
      - name: "Socomec D70 Mois"
        slave: 1
        address: 29953
        data_type: uint16
        scan_interval: 60
      - name: "Socomec D70 Annee"
        slave: 1
        address: 29954
        data_type: uint16
        scan_interval: 60
      - name: "Socomec D70 Heure"
        slave: 1
        address: 29955
        data_type: uint16
        scan_interval: 60
      - name: "Socomec D70 Minute"
        slave: 1
        address: 29956
        data_type: uint16
        scan_interval: 60
      - name: "Socomec D70 Seconde"
        slave: 1
        address: 29957
        data_type: uint16
        scan_interval: 60

      # =================================================================
      # MODULE S-135 (Mesures Circuit Dédié) - Slave ID: 3
      # =================================================================
      # Charge 1: Four
      - name: "Socomec S135 Four Courant I1"
        slave: 3
        address: 18458
        data_type: uint32
        scale: 0.001
        precision: 2
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Four Facteur de Puissance PF1"
        slave: 3
        address: 18518
        data_type: int16
        scale: 0.001
        precision: 3
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Four Puissance Active P1"
        slave: 3
        address: 18488
        data_type: int32
        scale: 1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Four Puissance Réactive Q1"
        slave: 3
        address: 18494
        data_type: int32
        scale: 1
        unit_of_measurement: "var"
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Four Puissance Apparente S1"
        slave: 3
        address: 18512
        data_type: uint32
        scale: 1
        unit_of_measurement: "VA"
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Four Énergie Active Ea+ L1"
        slave: 3
        address: 19843
        data_type: uint32
        scale: 0.001
        precision: 3
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        scan_interval: 60
      - name: "Socomec S135 Four Énergie Active Ea- L1"
        slave: 3
        address: 19846
        data_type: uint32
        scale: 0.001
        precision: 3
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        scan_interval: 60

      # Charge 2: Machine a Laver
      - name: "Socomec S135 Machine a Laver Courant I2"
        slave: 3
        address: 20506
        data_type: uint32
        scale: 0.001
        precision: 2
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Machine a Laver Facteur de Puissance PF2"
        slave: 3
        address: 20566
        data_type: int16
        scale: 0.001
        precision: 3
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Machine a Laver Puissance Active P2"
        slave: 3
        address: 20536
        data_type: int32
        scale: 1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Machine a Laver Puissance Réactive Q2"
        slave: 3
        address: 20542
        data_type: int32
        scale: 1
        unit_of_measurement: "var"
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Machine a Laver Puissance Apparente S2"
        slave: 3
        address: 20560
        data_type: uint32
        scale: 1
        unit_of_measurement: "VA"
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Machine a Laver Énergie Active Ea+ L2"
        slave: 3
        address: 21891
        data_type: uint32
        scale: 0.001
        precision: 3
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        scan_interval: 60
      - name: "Socomec S135 Machine a Laver Énergie Active Ea- L2"
        slave: 3
        address: 21894
        data_type: uint32
        scale: 0.001
        precision: 3
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        scan_interval: 60

      # Charge 3: Load 3
      - name: "Socomec S135 Load 3 Courant I3"
        slave: 3
        address: 22554
        data_type: uint32
        scale: 0.001
        precision: 2
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Load 3 Facteur de Puissance PF3"
        slave: 3
        address: 22614
        data_type: int16
        scale: 0.001
        precision: 3
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Load 3 Puissance Active P3"
        slave: 3
        address: 22584
        data_type: int32
        scale: 1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Load 3 Puissance Réactive Q3"
        slave: 3
        address: 22590
        data_type: int32
        scale: 1
        unit_of_measurement: "var"
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Load 3 Puissance Apparente S3"
        slave: 3
        address: 22608
        data_type: uint32
        scale: 1
        unit_of_measurement: "VA"
        state_class: measurement
        scan_interval: 15
      - name: "Socomec S135 Load 3 Énergie Active Ea+ L3"
        slave: 3
        address: 23939
        data_type: uint32
        scale: 0.001
        precision: 3
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        scan_interval: 60
      - name: "Socomec S135 Load 3 Énergie Active Ea- L3"
        slave: 3
        address: 23942
        data_type: uint32
        scale: 0.001
        precision: 3
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        scan_interval: 60

      # =================================================================
      # MODULE I-35 @4 - Slave ID: 4
      # =================================================================
      # Charge 1: Clim
      - name: "Socomec I35 @4 Clim Courant I1"
        slave: 4
        address: 18458
        data_type: uint32
        scale: 0.001
        precision: 2
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scan_interval: 15
      - name: "Socomec I35 @4 Clim Facteur de Puissance PF1"
        slave: 4
        address: 18518
        data_type: int16
        scale: 0.001
        precision: 3
        state_class: measurement
        scan_interval: 15
      - name: "Socomec I35 @4 Clim Puissance Active P1"
        slave: 4
        address: 18488
        data_type: int32
        scale: 1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 15
      - name: "Socomec I35 @4 Clim Puissance Réactive Q1"
        slave: 4
        address: 18494
        data_type: int32
        scale: 1
        unit_of_measurement: "var"
        state_class: measurement
        scan_interval: 15
      - name: "Socomec I35 @4 Clim Puissance Apparente S1"
        slave: 4
        address: 18512
        data_type: uint32
        scale: 1
        unit_of_measurement: "VA"
        state_class: measurement
        scan_interval: 15
      - name: "Socomec I35 @4 Clim Énergie Active Ea+ L1"
        slave: 4
        address: 19843
        data_type: uint32
        scale: 0.001
        precision: 3
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        scan_interval: 60
      - name: "Socomec I35 @4 Clim Énergie Active Ea- L1"
        slave: 4
        address: 19846
        data_type: uint32
        scale: 0.001
        precision: 3
        unit_of_measurement: "kWh"
