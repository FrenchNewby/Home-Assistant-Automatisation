sensor:
  - platform: history_stats
    name: "Nombre de démarrages Clim aujourd'hui"
    unique_id: count_clim_starts_today
    entity_id: binary_sensor.clim_active
    state: "on"
    type: count
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Durée TV aujourd'hui"
    unique_id: tv_active_duration_today
    entity_id: binary_sensor.tv_active
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
counter:
  total_clim_starts:
    name: "Nombre total de lancements Clim"
    icon: mdi:air-conditioner
utility_meter:
  consommation_electrique_journaliere:
    source: sensor.electricite_totale_clamps_kwh_robust
    cycle: daily
    name: "Électricité consommée aujourd'hui"
  consommation_gaz_journaliere:
    source: sensor.energie_totale_chaudiere_kwh
    cycle: daily
    name: "Gaz consommé aujourd'hui"



# Caméra HD 5Mpx via RTSP / FFmpeg
camera:
  - platform: ffmpeg
    name: "Camera Salon HD 5Mpx"
    input: "-rtsp_transport tcp -i rtsp://admin:Jojo1234*@192.168.1.46:8554/live/ch0"
