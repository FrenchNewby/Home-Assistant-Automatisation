- id: lumiere_auto_SdB_RDC
  alias: SdB RDC – Lumières auto binary_sensor.zpir7_occupancy → light.ampoule_sdb_rdc)
  description: >
    Allume si présence 
  mode: restart

  variables:
    lux_threshold: 2000
    is_dark: >
      {{ is_state('sun.sun','below_horizon') or (states('sensor.zrain_lux_illuminance')|float(9999)) < lux_threshold }}


  trigger:
    - platform: state
      entity_id: binary_sensor.zpir7_occupancy
  action:
    - choose:
        # ---- ALLUMAGE : uniquement quand il fait nuit ----
        - conditions:
            - condition: state
              entity_id: binary_sensor.zpir7_occupancy
              state: "on"
            - condition: template
              value_template: "{{ is_dark }}"
          sequence:
            - choose:
                # 1) Faible luminosité : 22h30 → 00h00 ou 00h01 → 05h30
                - conditions:
                    - condition: or
                      conditions:
                        - condition: time
                          after: "21:30:00"
                          before: "23:59:59"
                        - condition: time
                          after: "00:00:01"
                          before: "06:10:00"
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: light.ampoule_sdb_rdc
                      data:
                        brightness_pct: 15
                        transition: 1
              # 3) Sinon → 100 %
              default:
                - service: light.turn_on
                  target:
                    entity_id: 
                      - light.amp_sdb_rdc
                      - light.zamp1
                  data:
                    brightness_pct: 100
                    transition: 0.5

        # ---- EXTINCTION : toujours autorisée, un seul comportement ----
        - conditions:
            - condition: state
              entity_id: binary_sensor.zpir7_occupancy
              state: "off"
          sequence:
            - delay: "00:08:00"

            - condition: state
              entity_id: binary_sensor.zpir7_occupancy
              state: "off"

            - service: light.turn_off
              target:
                entity_id: 
                  - light.amp_sdb_rdc
                  - light.zamp1