- id: '1761475049114'
  alias: Mode Nuit
  description: 'On éteint toutes les lumieres et on baisse le chauffage dans les bureaux'
  trigger:
  - trigger: time
    at: '23:30:00'
  condition:
    - condition: time
      weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
      - sun

  actions:
    - target:
        entity_id: switch.all_lumieres
      action: switch.turn_off
    - target:
        entity_id: light.all_ampoules
      action: light.turn_off
    - action: climate.set_temperature
      target: { entity_id: climate.trv_bureau_johan}
      data: { temperature: 17 }
    - action: climate.set_temperature
      target: { entity_id: climate.trv_bureau_mami}
      data: { temperature: 17 }
            #  extinction du mode TV 
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.mode_tv