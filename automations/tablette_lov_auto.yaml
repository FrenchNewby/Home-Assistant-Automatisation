- id: tablette_ecran_fully_kiosk
  alias: "Tablette – Contrôle Écran via Détection Mouvement (Fully Kiosk)"
  description: >
    Allume l'écran de la tablette de manière logicielle (switch.tb330fu_ecran) sur détection de mouvement (06h-23h).
    Éteint l'écran après 5 minutes d'absence, en mode TV, ou à 23h.
  mode: restart

  trigger:
    # 1) Détection de mouvement dans les pièces de vie
    - platform: state
      entity_id:
        - binary_sensor.pir3_occupancy # Cuisine
        - binary_sensor.zpir6_occupancy # Salon
        - binary_sensor.ms2_presence # Salle à manger
      to: "on"
      id: presence_detectee

    # 2) Absence de mouvement pendant 5 min
    - platform: state
      entity_id:
        - binary_sensor.pir3_occupancy
        - binary_sensor.zpir6_occupancy
        - binary_sensor.ms2_presence
      to: "off"
      for: "00:15:00"
      id: absence_prolongee

    # 3) Activation du Mode TV
    - platform: state
      entity_id: input_boolean.mode_tv
      to: "on"
      id: tv_active

    # 4) Extinction à 23h00
    - platform: time
      at: "23:00:00"
      id: heure_nuit

  condition: []

  action:
    - choose:
        # --- ALLUMAGE DE L'ÉCRAN ---
        - conditions:
            - condition: trigger
              id: presence_detectee
            - condition: state
              entity_id: input_boolean.mode_tv
              state: "off"
            - condition: time
              after: "06:00:00"
              before: "23:00:00"
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.tb330fu_ecran

        # --- EXTINCTION DE L'ÉCRAN ---
        - conditions:
            - condition: or
              conditions:
                - condition: trigger
                  id: absence_prolongee
                - condition: trigger
                  id: tv_active
                - condition: trigger
                  id: heure_nuit
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.tb330fu_ecran

- id: tablette_charge_fully_kiosk
  alias: "Tablette – Gestion Intelligente de la Charge (Batterie 20%-80%)"
  description: >
    Active la charge (prise switch.pr6) si la batterie de la tablette descend sous 20%.
    Coupe la charge lorsque la batterie atteint 80%.
  mode: single

  trigger:
    - platform: numeric_state
      entity_id: sensor.tb330fu_batterie
      below: 20
    - platform: numeric_state
      entity_id: sensor.tb330fu_batterie
      above: 80
    - platform: homeassistant
      event: start
    - platform: state
      entity_id: sensor.tb330fu_batterie

  condition: []

  action:
    - choose:
        # --- ALLUMAGE DE LA PRISE (Début de charge) ---
        - conditions:
            - condition: numeric_state
              entity_id: sensor.tb330fu_batterie
              below: 20
            - condition: state
              entity_id: switch.pr6
              state: "off"
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.pr6

        # --- EXTINCTION DE LA PRISE (Fin de charge) ---
        - conditions:
            - condition: numeric_state
              entity_id: sensor.tb330fu_batterie
              above: 80
            - condition: state
              entity_id: switch.pr6
              state: "on"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.pr6
