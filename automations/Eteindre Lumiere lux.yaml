- id: '1761482816944'
  alias: Eteindre Lumière au dela de 800Lux (1x/jour)
  description: "Éteint le groupe de lumières si luminosité > 800 lux, une seule fois par jour."
  trigger:
    - platform: numeric_state
      entity_id:
        - sensor.ms1_illuminance
        - sensor.ms2_illuminance
      above: 1000
      for: "00:00:10"

  condition:
    - condition: state
      entity_id: input_boolean.luminosite_off_done
      state: "off"  # Ne le fait que si pas déjà exécuté aujourd'hui
    - condition: numeric_state
      entity_id:
        - sensor.ms1_illuminance
        - sensor.ms2_illuminance
      above: 1000

  action:
    - service: switch.turn_off
      target:
        entity_id: switch.all_lumieres
    - target:
        entity_id: light.all_ampoules
      action: light.turn_off

    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.luminosite_off_done

  mode: single
