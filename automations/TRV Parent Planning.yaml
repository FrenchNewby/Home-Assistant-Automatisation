- id: trv_parent_planning_ha
  alias: "TRV Parents – Planning"
  mode: single
  description: >
    Pilote la TRV climate.trv_parent via HA en fonction du planning semaine/week-end,
    en tenant compte des congés (via calendar.get_events) et des jours fériés.
    Remplace totalement le calendrier interne Tuya.

  trigger:
    - platform: time
      at: "06:00:00"
    - platform: time
      at: "06:30:00"
    - platform: time
      at: "07:30:00"
    - platform: time
      at: "16:45:00"
    - platform: time
      at: "20:30:00"

  action:
    # 1) On force la TRV en mode manuel (heat)
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.trv_parent
      data:
        hvac_mode: "heat"

    # 2) On récupère les événements du jour pour le calendrier famille_briche
    - variables:
        cal_entity: calendar.famille_briche
        today_start: "{{ today_at('00:00').isoformat() }}"
        today_end:   "{{ (today_at('00:00') + timedelta(days=1)).isoformat() }}"

    - service: calendar.get_events
      target:
        entity_id: "{{ cal_entity }}"
      data:
        start_date_time: "{{ today_start }}"
        end_date_time:   "{{ today_end }}"
      response_variable: evs

    # 3) On traite les événements & on détermine jour_travail / congé / férié
    - variables:
        trv: climate.trv_parent
        t: "{{ now().strftime('%H:%M') }}"

        # lundi=0 .. vendredi=4
        weekday: "{{ now().weekday() in [0,1,2,3,4] }}"

        # extraction des events du jour
        _raw: "{{ evs.get(cal_entity) if evs is mapping else evs }}"
        events: >-
          {% if _raw is mapping and 'events' in _raw %}
          {{ _raw['events'] }}
          {% elif _raw is sequence %}
          {{ _raw }}
          {% else %}
          {{ [] }}
          {% endif %}
        titles: "{{ events | map(attribute='summary') | select('string') | list }}"
        haystack: "{{ titles | map('lower') | list | join(' | ') }}"
        has_conge_today: "{{ 'conge' in haystack }}"

        # jour férié
        ferie: "{{ is_state('calendar.jours_feries_france', 'on') }}"

        # vrai jour travaillé = semaine ET pas férié ET pas congé
        jour_travail: "{{ weekday and not has_conge_today and not ferie }}"

    - choose:
        # =========================
        #      JOUR TRAVAILLÉ
        # =========================
        - conditions:
            - "{{ jour_travail and t == '06:00' }}"
          sequence:
            - service: climate.set_temperature
              target: { entity_id: "{{ trv }}" }
              data: { temperature: 20 }

        - conditions:
            - "{{ jour_travail and t == '07:30' }}"
            - condition: state
              entity_id: input_boolean.mode_teletravail_johan
              state: "off"
            - condition: state
              entity_id: input_boolean.mode_teletravail_mami
              state: "off"
          sequence:
            - service: climate.set_temperature
              target: { entity_id: "{{ trv }}" }
              data: { temperature: 17 }

        - conditions:
            - "{{ jour_travail and t == '16:45' }}"
          sequence:
            - service: climate.set_temperature
              target: { entity_id: "{{ trv }}" }
              data: { temperature: 20 }

        # =========================
        #   WEEK-END / CONGÉ / FÉRIÉ
        # =========================
        - conditions:
            - "{{ not jour_travail and t == '06:30' }}"
          sequence:
            - service: climate.set_temperature
              target: { entity_id: "{{ trv }}" }
              data: { temperature: 20 }


        # 20:30 → identique pour tout le monde
        - conditions:
            - "{{ t == '20:30' }}"
          sequence:
            - service: climate.set_temperature
              target: { entity_id: "{{ trv }}" }
              data: { temperature: 18 }

    # 4) petit log de debug
    - service: logbook.log
      data:
        name: "TRV PARENT"
        message: >
          Planning appliqué. jour_travail={{ jour_travail }},
          has_conge_today={{ has_conge_today }}, ferie={{ ferie }}, t={{ t }},
          titres={{ titles }}.
        entity_id: "{{ trv }}"
