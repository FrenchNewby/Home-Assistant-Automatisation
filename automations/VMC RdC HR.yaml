- id: '1760256512999'
  alias: SDB RdC VMC auto humidité
  description: ''
  triggers:
  - entity_id:
    - sensor.zth01_humidity
    above: 75
    for:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: switch.z1i
    state: 'off'
  - condition: template
    value_template: '{{ states(''sensor.zth01_humidity'')|float(0) > 0 }}'
  actions:
  - target:
      entity_id: switch.z1i
    action: switch.turn_on
  - wait_for_trigger:
    - entity_id:
      - sensor.zth01_humidity
      below: 71
      for:
        hours: 0
        minutes: 2
        seconds: 0
        milliseconds: 0
      trigger: numeric_state
    timeout: 00:30:00
    continue_on_timeout: true
  - target:
      entity_id: switch.z1i
    action: switch.turn_off
  mode: restart
